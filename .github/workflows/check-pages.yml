name: Check chapter pages

on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "pages/**"
      - "scripts/split_chapters.py"
      - ".github/workflows/check-pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "README.md"
      - "pages/**"
      - "scripts/split_chapters.py"
      - ".github/workflows/check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/split_chapters.py --check
