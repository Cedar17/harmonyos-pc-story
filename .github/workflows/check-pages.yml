name: Check Jekyll article site

on:
  pull_request:
    branches: [master]
    paths:
      - "index.md"
      - "_config.yml"
      - "README.md"
      - "images/**"
      - ".github/workflows/check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate rendered article and local assets
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_main = False
                  self.images = []
                  self.headings = []
                  self.canonical = []

              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  if tag == "main":
                      self.in_main = True
                  if self.in_main:
                      if tag == "img":
                          self.images.append(props)
                      if tag in ("h1", "h2", "h3"):
                          self.headings.append(tag)
                  if tag == "link" and props.get("rel") == "canonical":
                      self.canonical.append(props.get("href"))

              def handle_endtag(self, tag):
                  if tag == "main":
                      self.in_main = False

          site = Path("_site")
          html = (site / "index.html").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          parser = PageParser()
          parser.feed(html)
          expected_images = len(re.findall(r"!\[[^\]]*\]\(", readme))
          assert len(parser.images) == expected_images, f"Images: {len(parser.images)}/{expected_images}"
          assert parser.headings.count("h1") == 1, f"Expected one article title: {parser.headings}"
          assert len(parser.headings) >= 35, f"Headings missing: {len(parser.headings)}"
          for image in parser.images:
              assert image.get("alt", "").strip(), f"Missing alt text: {image}"
              src = unquote(urlsplit(image["src"]).path)
              assert not src.startswith("/"), f"Unexpected absolute image path: {src}"
              assert (site / src).is_file(), f"Missing image: {src}"
          assert "include_relative README.md" not in html, "README include not rendered"
          assert parser.canonical == ["https://cedar17.github.io/harmonyos-pc-story/"], parser.canonical
          assert (site / "assets/css/style.css").is_file(), "Minima stylesheet missing"
          assert (site / "sitemap.xml").is_file(), "Sitemap missing"
          assert not (site / "harmonyos-pc-story.docx").exists(), "DOCX should be excluded"
          print(f"PASS: {len(parser.headings)} headings, {len(parser.images)} images, canonical URL and Minima stylesheet")
          PY
      - name: Upload built site for review
        uses: actions/upload-artifact@v4
        with:
          name: minima-site-preview
          path: _site/
          retention-days: 7
